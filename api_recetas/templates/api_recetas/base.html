
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}API de Recetas{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <style>
        :root {
            --verde: #355e3b;
            --naranjo: #e58b45;
            --crema: #fff8ed;
            --linea: #e8dfd2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: var(--crema);
            color: #333;
    }

        .site-shell {
            min-height: 100vh;
        }

        .site-nav {
            min-height: 105px;
            padding: 20px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            background: white;
            border-bottom: 1px solid var(--linea);
        }

        .brand {
            color: var(--verde);
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: var(--verde);
            text-decoration: none;
            font-weight: bold;
        }

        .nav-link:hover {
            color: var(--naranjo);
        }

        main {
            width: 90%;
            max-width: 1350px;
            margin: 0 auto;
            padding: 35px 0;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid var(--linea);
        }

        @media (max-width: 600px) {
            .site-nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                gap: 12px;
            }

            main {
                width: 92%;
                padding: 25px 0;
            }
        }
    </style>
</head>

<body>
    <div class="site-shell">
        <header>
            <nav class="site-nav">
                <a href="{% url 'home' %}" class="brand">
                    API de Recetas
                </a>

                <div class="nav-links">
                    <a href="{% url 'home' %}" class="nav-link">
                        Inicio
                    </a>

                    <a href="/api_recetas/" class="nav-link">
                        API
                    </a>

                    <a href="/admin/" class="nav-link">
                        Administración
                    </a>
                </div>
            </nav>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer>
            <p>API de Recetas</p>
        </footer>
    </div>
</body>
</html>
