
{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %} API de recetas |{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/darkly.css' %}">
    <link rel="stylesheet" href="{% static 'css/datatables.css' %}">

    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
    <script src="{% static 'js/jquery_v4.0.0.js' %}"></script>
    <script src="{% static 'js/datatables.js' %}"></script>

    <link rel="shortcut icon" href="{% static 'images/receta.png' %}" type="image/x-icon">
</head>
<body>
    <div class="site-shell">
        <header>
            <nav class="site-nav">
                <a href="{% url 'home' %}" class="brand">
                    API de Recetas
                </a>

                <div class="nav-links">
                    <a href="{% url 'home' %}" class="nav-link">
                        Inicio
                    </a>

                    <a href="{% url 'categoria_list' %}" class="nav-link">
                        Categorías
                    </a>

                    <a href="/api_recetas/" class="nav-link">
                        API
                    </a>

                    <a href="/admin/" class="nav-link">
                        Administración
                    </a>
                </div>
            </nav>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer>
            <p>API de Recetas</p>
        </footer>
    </div>
</body>
</html>
